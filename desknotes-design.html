<title>Мастерская стикеров</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bad+Script&family=Caveat:wght@500;700&family=Marck+Script&family=Neucha&family=Pangolin&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: fake desktop canvas on the left where stickers live; a quiet settings rail on the right. */
:root {
  --bg: #eceef2; --panel: #ffffff; --fg: #1b1e24; --muted: #5b6270; --line: #d8dce3;
  --accent: #2f66d6; --accent-soft: #e3ebfb; --danger: #c23a3a;
  --ui: "Onest", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171b; --panel: #1e2127; --fg: #e8eaef; --muted: #9ba2ae; --line: #30343c;
  --accent: #7ea6ff; --accent-soft: #24304a; --danger: #ff7b7b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1e2127; --fg: #e8eaef; --muted: #9ba2ae; --line: #30343c;
  --accent: #7ea6ff; --accent-soft: #24304a; --danger: #ff7b7b; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; max-width: 1280px; margin: 0 auto; align-items: start }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr) } }

/* desktop */
.desk { position: relative; height: 640px; border-radius: 10px; overflow: hidden; background: var(--wall); touch-action: none; user-select: none }
.desk.cork { background-color: var(--wall); background-image: radial-gradient(rgba(70,40,15,.28) 1px, transparent 1.6px), radial-gradient(rgba(255,235,200,.18) 1px, transparent 1.6px); background-size: 9px 9px, 13px 13px; background-position: 0 0, 4px 6px }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: rgba(10,12,16,.55); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #d9dde5; font-size: 12px; z-index: 9999 }
.taskbar kbd { font-family: var(--ui); background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 6px }
.addnote { position: absolute; left: 12px; top: 12px; z-index: 9998; font: 500 13px var(--ui); color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 7px 12px; cursor: pointer }
.addnote:hover { background: rgba(255,255,255,.24) }

/* note */
.note { position: absolute; transform: rotate(var(--rot)); touch-action: none; cursor: grab }
.note:active { cursor: grabbing }
.note.sel .face { outline: 2px dashed rgba(255,255,255,.55); outline-offset: 5px }
.card { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d }
.card.flipped { transform: rotateY(180deg) }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background-color: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh); padding: 18px 16px 14px 16px; overflow: auto; scrollbar-width: thin;
  box-shadow: 0 calc(var(--sh) * 1px) calc(var(--sh) * 2.2px) rgba(0,0,0,calc(.12 + var(--sh) * .012)), 0 1px 2px rgba(0,0,0,.18);
  border-radius: 2px 2px 3px 14px / 2px 2px 3px 6px }
.face.back { transform: rotateY(180deg) }
.p-ruled { background-image: linear-gradient(90deg, transparent 30px, rgba(214,70,70,.55) 30px, rgba(214,70,70,.55) 31.5px, transparent 31.5px),
  repeating-linear-gradient(transparent 0, transparent calc(var(--lh) - 1px), rgba(70,110,180,.32) calc(var(--lh) - 1px), rgba(70,110,180,.32) var(--lh));
  background-position: 0 0, 0 calc(18px + var(--title-h)); padding-left: 40px }
.p-grid { background-image: linear-gradient(rgba(70,110,180,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(70,110,180,.22) 1px, transparent 1px); background-size: 18px 18px }
.p-kraft { background-image: radial-gradient(rgba(90,60,30,.16) 1px, transparent 1.4px); background-size: 5px 5px }

.ntitle { font-weight: 700; font-size: 1.12em; outline: none; display: inline-block; min-width: 3em; cursor: text; padding-bottom: 2px;
  background: linear-gradient(var(--ink), var(--ink)) no-repeat 0 100% / 100% 1.5px; opacity: .95 }
.tasks { list-style: none; margin: 4px 0 0; padding: 0 }
.task { display: flex; align-items: flex-start; gap: 6px; position: relative }
.cb { flex: none; width: calc(var(--fs) * .95); height: calc(var(--fs) * .95); margin-top: calc((var(--lh) - var(--fs) * .95) / 2); padding: 0; border: 0; background: none; cursor: pointer; color: var(--ink) }
.cb svg { width: 100%; height: 100%; overflow: visible }
.txt { flex: 1; min-width: 0; cursor: pointer; overflow-wrap: anywhere; border-radius: 2px }
.task.done .txt { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .5 }
.task.open > .txt { text-decoration-line: underline; text-decoration-style: wavy; text-decoration-thickness: 1px; text-underline-offset: 4px }
.task.done.open > .txt { text-decoration-line: line-through underline }
.ts-dot .task.tagged > .txt::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--tag); margin-right: .35em; vertical-align: .08em }
.ts-marker .task.tagged > .txt { background: linear-gradient(transparent 52%, color-mix(in srgb, var(--tag) 55%, transparent) 52%, color-mix(in srgb, var(--tag) 55%, transparent) 92%, transparent 92%); box-decoration-break: clone; -webkit-box-decoration-break: clone }
.ts-ink .task.tagged > .txt { color: var(--tag) }
.tools { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; margin-top: calc((var(--lh) - 18px) / 2) }
.task:hover > .tools, .task:focus-within > .tools { opacity: 1 }
.tbtn { width: 18px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--ink); font: 14px/18px var(--ui); opacity: .7; border-radius: 50% }
.tbtn:hover { opacity: 1 }
.tagbtn { border: 1.5px dashed currentColor; width: 13px; height: 13px; margin: 2.5px }
.tagbtn.has { border: 0; background: var(--tag); width: 13px; height: 13px }
.addrow { display: flex; gap: 6px; align-items: center; opacity: .55; margin-top: 2px }
.addrow:focus-within { opacity: 1 }
.paperin { flex: 1; min-width: 0; font: inherit; color: inherit; background: none; border: 0; outline: none; padding: 0; line-height: var(--lh) }
.paperin::placeholder { color: inherit; opacity: .7 }

.details { margin: 2px 0 6px calc(var(--fs) * .95 + 6px); padding: 4px 0 4px 10px; border-left: 2px solid color-mix(in srgb, var(--ink) 35%, transparent); font-size: .86em; line-height: calc(var(--lh) * .86) }
.details textarea { width: 100%; font: inherit; color: inherit; background: none; border: 0; outline: none; resize: none; padding: 0; overflow: hidden; display: block; line-height: inherit }
.details textarea::placeholder, .details input::placeholder { color: inherit; opacity: .55 }
.dtitle { font-weight: 700; width: 100% }
.sub { list-style: none; padding: 0; margin: 2px 0 0 }
.sub li { display: flex; gap: 5px; align-items: flex-start }
.sub .cb { width: .8em; height: .8em; margin-top: calc((var(--lh) * .86 - .8em) / 2) }
.sub li.done input { text-decoration: line-through; opacity: .5 }
.backbtn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; opacity: .7; margin-bottom: 6px }
.backbtn:hover { opacity: 1 }

.side { position: absolute; left: calc(100% + 18px); top: 26px; width: 230px; min-height: 120px; transform: rotate(calc(var(--rot) * -1 + 2deg)); z-index: 2 }
.side .face { position: relative; inset: auto; overflow: visible; padding-top: 16px }
.side .details { margin-left: 0; border-left: 0; padding-left: 0; font-size: .92em }
.closex { position: absolute; right: 6px; top: 2px; font: 18px var(--ui); color: var(--ink); background: none; border: 0; cursor: pointer; opacity: .6 }

.pin { position: absolute; z-index: 3; pointer-events: none; left: 50%; top: 0; transform: translateX(-50%) }
.pin-tape { width: 86px; height: 24px; top: -11px; background: rgba(240,235,220,.55); transform: translateX(-50%) rotate(-3deg);
  box-shadow: 0 1px 2px rgba(0,0,0,.12); -webkit-mask: linear-gradient(90deg, transparent 0, #000 3px calc(100% - 3px), transparent 100%) }
.pin-push { width: 18px; height: 18px; top: -6px; border-radius: 50%; background: #d8433f; box-shadow: inset -3px -3px 0 rgba(0,0,0,.18), 2px 4px 4px rgba(0,0,0,.3) }
.pin-clip { width: 18px; height: 46px; top: -20px; left: 28px; transform: rotate(-6deg); border: 2.5px solid #9aa2ad; border-radius: 9px; box-shadow: inset 0 0 0 3px transparent }
.pin-clip::after { content: ""; position: absolute; left: 3px; right: 3px; top: 8px; bottom: -2px; border: 2.5px solid #9aa2ad; border-top: 0; border-radius: 0 0 6px 6px }
.rs { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; cursor: nwse-resize; z-index: 4; opacity: 0 }
.note.sel .rs { opacity: .8 }
.rs::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 8px; height: 8px; border-right: 2px solid rgba(0,0,0,.45); border-bottom: 2px solid rgba(0,0,0,.45) }

/* panel */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 18px; align-content: start }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 }
.sec { display: grid; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line) }
.sec:first-child { border-top: 0; padding-top: 0 }
.row { display: grid; gap: 6px }
.lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; letter-spacing: .01em }
.lbl b { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: 500 12.5px var(--ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer }
.chip:hover { border-color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0 }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent) }
.swc { position: relative; overflow: hidden; background: conic-gradient(#f66, #fd5, #6d6, #5cf, #a7f, #f6a, #f66) }
.swc input { position: absolute; inset: -6px; opacity: 0; cursor: pointer }
.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.fontbtn { text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; cursor: pointer; color: var(--fg) }
.fontbtn span { display: block; font-size: 20px; line-height: 1.2 }
.fontbtn small { font: 11px var(--ui); color: var(--muted) }
.fontbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
input[type=range] { width: 100%; accent-color: var(--accent) }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
.btn { font: 500 13px var(--ui); border-radius: 8px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg) }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel) }
.btn.warn { color: var(--danger) }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0 }
.tagpal { display: flex; gap: 8px }
.tagpal label { position: relative; width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); cursor: pointer }
.tagpal input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
#out { width: 100%; height: 90px; font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px }
.howto { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; line-height: 1.6; max-width: 70ch }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
@media (prefers-reduced-motion: reduce) { .card { transition: none } }
</style>

<div class="wrap">
  <div>
    <div class="desk" id="desk"></div>
    <p class="howto">Тащи стикер за бумагу, угол справа снизу меняет размер. Клик по делу раскрывает подробности, кружок справа от дела ставит цветную метку, заголовок и текст можно править прямо на бумаге.</p>
  </div>
  <aside class="panel" id="panel" aria-label="Настройки дизайна"></aside>
</div>

<script>
const FONTS = [
  { id: 'Caveat', css: "'Caveat', 'Segoe Print', cursive", k: 1.18 },
  { id: 'Neucha', css: "'Neucha', 'Segoe Print', cursive", k: 1 },
  { id: 'Pangolin', css: "'Pangolin', 'Segoe Print', cursive", k: .9 },
  { id: 'Marck Script', css: "'Marck Script', 'Segoe Script', cursive", k: 1.05 },
  { id: 'Bad Script', css: "'Bad Script', 'Segoe Script', cursive", k: .92 },
  { id: 'Amatic SC', css: "'Amatic SC', 'Segoe Print', cursive", k: 1.3 }
];
const PAPERS = [['plain', 'Стикер'], ['ruled', 'Линейка'], ['grid', 'Клетка'], ['kraft', 'Крафт']];
const PAPER_COLORS = ['#FFE27A', '#FFF3B0', '#FFC4D3', '#BFE4F6', '#C9EBC1', '#FFD2A6', '#F6F4EF', '#D2BC96'];
const INKS = ['#2A2C3A', '#1E3F99', '#5B3A24', '#8A1F2C'];
const PINS = [['tape', 'Скотч'], ['push', 'Кнопка'], ['clip', 'Скрепка'], ['none', 'Без']];
const WALLS = [['#1d2532', 'Ночь'], ['#2b2c30', 'Графит'], ['#1f3b34', 'Лес'], ['#3a6aa0', 'Небо'], ['#b2875a', 'Пробка']];
const DETAILS = [['inline', 'Раскрыть в списке'], ['side', 'Стикер рядом'], ['flip', 'Перевернуть']];
const TAGSTYLES = [['dot', 'Точка'], ['marker', 'Маркер'], ['ink', 'Цвет текста']];

let uid = 100;
const T = (text, o = {}) => Object.assign({ id: 't' + (uid++), text, done: false, tag: null, details: '', sub: [] }, o);
const DEFAULT = () => ({
  wall: '#1d2532', detailsMode: 'inline', tagStyle: 'marker',
  tagColors: ['#ff5a5a', '#ffb020', '#3cc46f', '#3d8bff', '#b46cff'],
  notes: [
    { id: 'n1', x: 46, y: 58, w: 270, h: 330, rot: -2, paper: 'plain', color: '#FFE27A', ink: '#2A2C3A', font: 'Caveat', fs: 22, pin: 'tape', shadow: 8, z: 2,
      title: 'Сегодня', open: null, tasks: [
        T('Купить продукты', { tag: 1, details: 'Зайти после работы', sub: [{ text: 'молоко', done: true }, { text: 'хлеб', done: false }, { text: 'яйца', done: false }] }),
        T('Записаться на ТО машины', { tag: 0, details: 'Позвонить в сервис до пятницы, спросить про масло' }),
        T('Дописать главу 2', { tag: 3 }),
        T('Отправить резюме', { done: true })
      ] },
    { id: 'n2', x: 380, y: 96, w: 250, h: 270, rot: 1.5, paper: 'ruled', color: '#F6F4EF', ink: '#1E3F99', font: 'Neucha', fs: 19, pin: 'push', shadow: 6, z: 1,
      title: 'Идеи', open: null, tasks: [
        T('Стикеры на рабочий стол', { done: true, tag: 2 }),
        T('Курс по C# на выходных'),
        T('Собрать сетап для стримов', { tag: 4, details: 'Микрофон, свет, второй монитор' })
      ] }
  ]
});

const KEY = 'desknotes-design-v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) } catch (e) { S = null }
if (!S || !Array.isArray(S.notes)) S = DEFAULT();
S.notes.forEach(n => n.tasks.forEach(t => { const k = +String(t.id).slice(1); if (k >= uid) uid = k + 1 }));
let sel = S.notes.length ? S.notes[0].id : null;
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {} }, 250) }

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const note = id => S.notes.find(n => n.id === id);
const fontOf = n => FONTS.find(f => f.id === n.font) || FONTS[0];

function checkSvg(done, color) {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('viewBox', '0 0 20 20');
  s.innerHTML = '<path d="M3 3.6C7.5 3 12.5 3.3 16.8 3.4C17.3 8 17 12.5 16.7 16.9C12 17.3 7.4 17 3.3 16.7C3.1 12.2 2.8 7.9 3 3.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
    (done ? '<path d="M5 9.6C6.8 11.2 8 13.2 9 15.2C11 10.5 14.3 5.6 19.5 1.2" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' : '');
  return s;
}

/* ---------- desk ---------- */
function renderDesk() {
  const desk = $('#desk');
  desk.innerHTML = '';
  desk.style.setProperty('--wall', S.wall);
  desk.classList.toggle('cork', S.wall === '#b2875a');
  desk.className = desk.className.replace(/\bts-\w+/g, '').trim() + ' ts-' + S.tagStyle;
  desk.append(h('button', { class: 'addnote', onclick: addNote }, '+ стикер'));
  S.notes.forEach(n => desk.append(buildNote(n)));
  desk.append(h('div', { class: 'taskbar' }, h('span', null, 'Вызвать стикеры: ', h('kbd', null, 'Ctrl+Alt+N'), '  ·  вернуть: ', h('kbd', null, 'Esc')), h('span', null, clock())));
}
function clock() { const d = new Date(); return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) }

function buildNote(n) {
  const f = fontOf(n);
  const fs = Math.round(n.fs * f.k);
  const lh = Math.round(fs * 1.38);
  const el = h('div', { class: 'note' + (n.id === sel ? ' sel' : ''), 'data-id': n.id, style: {
    left: n.x + 'px', top: n.y + 'px', width: n.w + 'px', height: n.h + 'px', zIndex: n.z } });
  el.style.setProperty('--rot', n.rot + 'deg');
  el.style.setProperty('--paper', n.color);
  el.style.setProperty('--ink', n.ink);
  el.style.setProperty('--font', f.css);
  el.style.setProperty('--fs', fs + 'px');
  el.style.setProperty('--lh', lh + 'px');
  el.style.setProperty('--sh', n.shadow);
  el.style.setProperty('--title-h', Math.round(fs * 1.12 * 1.38 + 6) + 'px');

  const openTask = n.tasks.find(t => t.id === n.open);
  const flipped = S.detailsMode === 'flip' && openTask;
  const card = h('div', { class: 'card' + (flipped ? ' flipped' : '') });
  const front = h('div', { class: 'face p-' + n.paper });

  const title = h('div', { class: 'ntitle', contenteditable: 'true', spellcheck: 'false', 'data-nodrag': true,
    oninput: e => { n.title = e.target.textContent; save() },
    onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur() } } }, n.title);
  front.append(title);

  const ul = h('ul', { class: 'tasks' });
  n.tasks.forEach(t => {
    const li = h('li', { class: 'task' + (t.done ? ' done' : '') + (t.tag != null ? ' tagged' : '') + (n.open === t.id ? ' open' : '') });
    if (t.tag != null) li.style.setProperty('--tag', S.tagColors[t.tag]);
    li.append(
      h('button', { class: 'cb', 'data-nodrag': true, 'aria-label': t.done ? 'Снять отметку' : 'Отметить выполненным',
        onclick: () => { t.done = !t.done; commit() } }, checkSvg(t.done, S.tagStyle === 'ink' && t.tag != null ? S.tagColors[t.tag] : null)),
      h('span', { class: 'txt', 'data-nodrag': true, onclick: () => { n.open = n.open === t.id ? null : t.id; commit() } }, t.text),
      h('span', { class: 'tools' },
        h('button', { class: 'tbtn tagbtn' + (t.tag != null ? ' has' : ''), 'data-nodrag': true, title: 'Цветная метка', 'aria-label': 'Сменить цветную метку',
          onclick: () => { t.tag = t.tag == null ? 0 : (t.tag + 1 < S.tagColors.length ? t.tag + 1 : null); commit() } }),
        h('button', { class: 'tbtn', 'data-nodrag': true, title: 'Удалить', 'aria-label': 'Удалить дело',
          onclick: () => { n.tasks = n.tasks.filter(x => x !== t); if (n.open === t.id) n.open = null; commit() } }, '×'))
    );
    ul.append(li);
    if (S.detailsMode === 'inline' && n.open === t.id) ul.append(h('li', null, detailsEditor(n, t)));
  });
  front.append(ul);
  front.append(h('div', { class: 'addrow' }, h('span', { style: { width: 'calc(var(--fs) * .95)', textAlign: 'center' } }, '+'),
    h('input', { class: 'paperin', 'data-nodrag': true, 'data-add': n.id, placeholder: 'новое дело', 'aria-label': 'Новое дело',
      onkeydown: e => { if (e.key === 'Enter' && e.target.value.trim()) { n.tasks.push(T(e.target.value.trim())); commit(); refocus('[data-add="' + n.id + '"]') } } })));

  card.append(front);
  if (S.detailsMode === 'flip') {
    const back = h('div', { class: 'face back p-' + n.paper });
    if (openTask) back.append(h('button', { class: 'backbtn', 'data-nodrag': true, onclick: () => { n.open = null; commit() } }, '← к списку'), detailsEditor(n, openTask));
    card.append(back);
  }
  el.append(card);
  if (n.pin !== 'none') el.append(h('div', { class: 'pin pin-' + n.pin }));
  if (S.detailsMode === 'side' && openTask) {
    const side = h('div', { class: 'side' }, h('div', { class: 'face p-plain', style: { background: lighten(n.color) } },
      h('button', { class: 'closex', 'data-nodrag': true, 'aria-label': 'Закрыть', onclick: () => { n.open = null; commit() } }, '×'),
      detailsEditor(n, openTask)));
    el.append(side);
  }
  el.append(h('div', { class: 'rs', title: 'Размер' }));
  return el;
}

function lighten(hex) {
  const n = parseInt(hex.slice(1), 16);
  const m = c => Math.round(c + (255 - c) * .35);
  return 'rgb(' + m(n >> 16) + ',' + m((n >> 8) & 255) + ',' + m(n & 255) + ')';
}

function detailsEditor(n, t) {
  const box = h('div', { class: 'details' });
  if (S.detailsMode !== 'inline') box.append(h('input', { class: 'paperin dtitle', 'data-nodrag': true, value: t.text, 'aria-label': 'Название дела',
    onchange: e => { t.text = e.target.value || t.text; commit() } }));
  const ta = h('textarea', { 'data-nodrag': true, rows: 1, placeholder: 'подробности…', 'aria-label': 'Подробности дела',
    oninput: e => { t.details = e.target.value; grow(e.target); save() } });
  ta.value = t.details;
  box.append(ta);
  requestAnimationFrame(() => grow(ta));
  const sub = h('ul', { class: 'sub' });
  t.sub.forEach((s, i) => sub.append(h('li', { class: s.done ? 'done' : '' },
    h('button', { class: 'cb', 'data-nodrag': true, 'aria-label': 'Отметить пункт', onclick: () => { s.done = !s.done; commit() } }, checkSvg(s.done)),
    h('input', { class: 'paperin', 'data-nodrag': true, value: s.text, 'aria-label': 'Пункт',
      onchange: e => { if (e.target.value.trim()) s.text = e.target.value; else t.sub.splice(i, 1); commit() } }))));
  sub.append(h('li', null, h('span', { style: { width: '.8em', textAlign: 'center' } }, '+'),
    h('input', { class: 'paperin', 'data-nodrag': true, 'data-sub': t.id, placeholder: 'пункт', 'aria-label': 'Новый пункт',
      onkeydown: e => { if (e.key === 'Enter' && e.target.value.trim()) { t.sub.push({ text: e.target.value.trim(), done: false }); commit(); refocus('[data-sub="' + t.id + '"]') } } })));
  box.append(sub);
  return box;
}
function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px' }
function refocus(q) { requestAnimationFrame(() => { const e = document.querySelector(q); if (e) e.focus() }) }

function commit() { renderDesk(); save() }

/* drag + resize */
let drag = null;
$('#desk').addEventListener('pointerdown', e => {
  const el = e.target.closest('.note');
  if (!el) return;
  const n = note(el.dataset.id);
  if (sel !== n.id) {
    sel = n.id;
    n.z = Math.max(...S.notes.map(x => x.z)) + 1;
    el.style.zIndex = n.z;
    document.querySelectorAll('.note').forEach(x => x.classList.toggle('sel', x === el));
    renderPanel();
    save();
  }
  if (e.target.closest('[data-nodrag],input,textarea,button')) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  drag = { el, n, mode: e.target.closest('.rs') ? 'size' : 'move', sx: e.clientX, sy: e.clientY, x: n.x, y: n.y, w: n.w, h: n.h };
  el.setPointerCapture(e.pointerId);
});
$('#desk').addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, desk = $('#desk');
  if (drag.mode === 'move') {
    drag.n.x = Math.round(Math.min(Math.max(drag.x + dx, -drag.n.w + 60), desk.clientWidth - 60));
    drag.n.y = Math.round(Math.min(Math.max(drag.y + dy, 0), desk.clientHeight - 80));
    drag.el.style.left = drag.n.x + 'px'; drag.el.style.top = drag.n.y + 'px';
  } else {
    drag.n.w = Math.round(Math.max(170, drag.w + dx)); drag.n.h = Math.round(Math.max(140, drag.h + dy));
    drag.el.style.width = drag.n.w + 'px'; drag.el.style.height = drag.n.h + 'px';
    renderPanelValues();
  }
});
['pointerup', 'pointercancel'].forEach(t => $('#desk').addEventListener(t, () => { if (drag) { drag = null; save() } }));

function addNote() {
  const z = S.notes.length ? Math.max(...S.notes.map(x => x.z)) + 1 : 1;
  const base = note(sel) || DEFAULT().notes[0];
  const n = { id: 'n' + Date.now(), x: 120 + Math.round(Math.random() * 160), y: 80 + Math.round(Math.random() * 120), w: 240, h: 240,
    rot: Math.round((Math.random() * 6 - 3) * 2) / 2, paper: base.paper, color: PAPER_COLORS[Math.floor(Math.random() * PAPER_COLORS.length)],
    ink: base.ink, font: base.font, fs: base.fs, pin: base.pin, shadow: base.shadow, z, title: 'Новый стикер', open: null, tasks: [] };
  S.notes.push(n); sel = n.id; commit(); renderPanel();
}

/* ---------- panel ---------- */
function chips(list, cur, set) {
  return h('div', { class: 'chips' }, list.map(([v, label]) =>
    h('button', { class: 'chip', 'aria-pressed': String(cur === v), onclick: () => { set(v); commit(); renderPanel() } }, label)));
}
function swatches(list, cur, set, custom) {
  const wrap = h('div', { class: 'chips' }, list.map(c => {
    const v = Array.isArray(c) ? c[0] : c;
    return h('button', { class: 'sw', style: { background: v }, title: Array.isArray(c) ? c[1] : v, 'aria-label': Array.isArray(c) ? c[1] : 'Цвет ' + v,
      'aria-pressed': String(cur.toLowerCase() === v.toLowerCase()), onclick: () => { set(v); commit(); renderPanel() } });
  }));
  if (custom) {
    const inp = h('input', { type: 'color', value: cur, 'aria-label': 'Свой цвет', oninput: e => { set(e.target.value); commit() }, onchange: () => renderPanel() });
    wrap.append(h('label', { class: 'sw swc', title: 'Свой цвет' }, inp));
  }
  return wrap;
}
function slider(id, label, min, max, step, val, unit, set) {
  return h('div', { class: 'row' },
    h('label', { class: 'lbl', for: id }, label, h('b', { id: id + '-v' }, val + unit)),
    h('input', { type: 'range', id, min, max, step, value: val, oninput: e => { set(+e.target.value); $('#' + id + '-v').textContent = e.target.value + unit; commit() } }));
}
function renderPanelValues() {
  const n = note(sel); if (!n) return;
  const s = $('#size-v'); if (s) s.textContent = n.w + ' × ' + n.h;
}

function renderPanel() {
  const p = $('#panel');
  p.innerHTML = '';
  const n = note(sel);
  if (n) {
    p.append(h('div', { class: 'sec' },
      h('h2', null, 'Стикер «' + (n.title || 'без названия') + '»'),
      h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Бумага'), chips(PAPERS, n.paper, v => n.paper = v)),
      h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Цвет бумаги'), swatches(PAPER_COLORS, n.color, v => n.color = v, true)),
      h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Чернила'), swatches(INKS, n.ink, v => n.ink = v, true)),
      h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Почерк'),
        h('div', { class: 'fonts' }, FONTS.map(f => h('button', { class: 'fontbtn', 'aria-pressed': String(n.font === f.id),
          onclick: () => { n.font = f.id; commit(); renderPanel() } }, h('span', { style: { fontFamily: f.css } }, 'Купить хлеб'), h('small', null, f.id))))),
      slider('fs', 'Размер текста', 14, 32, 1, n.fs, '', v => n.fs = v),
      slider('rot', 'Наклон', -8, 8, .5, n.rot, '°', v => n.rot = v),
      slider('sh', 'Тень', 0, 20, 1, n.shadow, '', v => n.shadow = v),
      h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Крепление'), chips(PINS, n.pin, v => n.pin = v)),
      h('div', { class: 'lbl' }, 'Размер', h('b', { id: 'size-v' }, n.w + ' × ' + n.h)),
      h('div', { class: 'btns' },
        h('button', { class: 'btn', onclick: () => { const c = JSON.parse(JSON.stringify(n)); c.id = 'n' + Date.now(); c.x += 30; c.y += 30; c.z = Math.max(...S.notes.map(x => x.z)) + 1; c.tasks.forEach(t => t.id = 't' + (uid++)); S.notes.push(c); sel = c.id; commit(); renderPanel() } }, 'Дублировать'),
        h('button', { class: 'btn warn', onclick: () => { S.notes = S.notes.filter(x => x !== n); sel = S.notes.length ? S.notes[S.notes.length - 1].id : null; commit(); renderPanel() } }, 'Удалить стикер'))
    ));
  } else {
    p.append(h('div', { class: 'sec' }, h('h2', null, 'Стикеров нет'), h('p', { class: 'hint' }, 'Нажми «+ стикер» на рабочем столе, чтобы добавить новый.')));
  }

  const tagPal = h('div', { class: 'tagpal' }, S.tagColors.map((c, i) => h('label', { style: { background: c }, title: 'Метка ' + (i + 1) },
    h('input', { type: 'color', value: c, 'aria-label': 'Цвет метки ' + (i + 1), oninput: e => { S.tagColors[i] = e.target.value; e.target.parentNode.style.background = e.target.value; commit() } }))));
  p.append(h('div', { class: 'sec' },
    h('h2', null, 'Для всех стикеров'),
    h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Подробности дела'), chips(DETAILS, S.detailsMode, v => S.detailsMode = v)),
    h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Как выглядит метка'), chips(TAGSTYLES, S.tagStyle, v => S.tagStyle = v)),
    h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Цвета меток'), tagPal),
    h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Обои (только для примерки)'), swatches(WALLS, S.wall, v => S.wall = v, false))
  ));

  const out = h('textarea', { id: 'out', readonly: true, 'aria-label': 'Настройки дизайна' });
  out.hidden = true;
  const copyBtn = h('button', { class: 'btn primary', onclick: async () => {
    const txt = exportText();
    out.value = txt;
    try { await navigator.clipboard.writeText(txt); copyBtn.textContent = 'Скопировано' }
    catch (e) { out.hidden = false; out.select(); copyBtn.textContent = 'Скопируй текст ниже' }
    setTimeout(() => copyBtn.textContent = 'Скопировать дизайн', 2500);
  } }, 'Скопировать дизайн');
  const reset = h('button', { class: 'btn', onclick: () => {
    if (reset.dataset.armed) { S = DEFAULT(); sel = S.notes[0].id; commit(); renderPanel(); }
    else { reset.dataset.armed = '1'; reset.textContent = 'Точно сбросить?'; reset.classList.add('warn'); setTimeout(() => { if (reset.isConnected) { delete reset.dataset.armed; reset.textContent = 'Сбросить' ; reset.classList.remove('warn') } }, 3000) }
  } }, 'Сбросить');
  p.append(h('div', { class: 'sec' },
    h('h2', null, 'Готово?'),
    h('p', { class: 'hint' }, 'Нажми «Скопировать дизайн» и вставь в чат. Я перенесу его в программу один в один.'),
    h('div', { class: 'btns' }, copyBtn, reset), out));
}

function exportText() {
  const d = {
    detailsMode: S.detailsMode, tagStyle: S.tagStyle, tagColors: S.tagColors,
    notes: S.notes.map(n => ({ title: n.title, x: n.x, y: n.y, w: n.w, h: n.h, rot: n.rot, paper: n.paper, color: n.color, ink: n.ink, font: n.font, fs: n.fs, pin: n.pin, shadow: n.shadow, tasks: n.tasks.length }))
  };
  return 'DeskNotes дизайн:\n' + JSON.stringify(d);
}

renderDesk();
renderPanel();
setInterval(() => { const t = document.querySelector('.taskbar span:last-child'); if (t) t.textContent = clock() }, 30000);
</script>
